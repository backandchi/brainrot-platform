services:
  postgres:
    image: postgres:16-alpine
    container_name: brainrot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainrot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainrot_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-brainrot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brainrot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: brainrot-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-brainrot}:${POSTGRES_PASSWORD:-brainrot_secret_pass}@postgres:5432/${POSTGRES_DB:-brainrot_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_brainrot_platform}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: brainrot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
      NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME}
    depends_on:
      - api

  bot:
    build:
      context: apps/bot
      dockerfile: Dockerfile
    container_name: brainrot-bot
    restart: always
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      API_INTERNAL_URL: http://api:3001
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
